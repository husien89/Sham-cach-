<!-- 📚 مكتبات QR + PDF -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- 🧠 منطق التشغيل الكامل — المرسل: عبد العزيز الفارس باللون الأخضر -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    let cameraStream = null;
    let scanningActive = false;
    let qrData = { receiver: '', receiverAcc: '', ref: '', date: '', time: '' };

    // 🔹 اسم المرسل ثابت دائماً — باللون الأخضر
    const SENDER_FIXED = 'عبد العزيز الفارس';
    const SENDER_ACCOUNT = '2846********';

    // العناصر
    const openCameraBtn = document.querySelector('button, .btn, [role="button"]');
    const amountInput = document.querySelector('input[type="number"], input[placeholder*="0.00"]');
    const pdfBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('PDF'));
    
    // حقول العرض
    const receiverEl = Array.from(document.querySelectorAll('div, span')).find(el => el.textContent.includes('اسم المستلم'));
    const receiverAccEl = Array.from(document.querySelectorAll('div, span')).find(el => el.textContent.includes('حساب المستلم'));
    const refEl = Array.from(document.querySelectorAll('div, span')).find(el => el.textContent.includes('رقم العملية'));
    const dateTimeEl = Array.from(document.querySelectorAll('div, span')).find(el => el.textContent.includes('التاريخ والوقت'));

    // 📷 فتح الكاميرا وقراءة QR
    if (openCameraBtn) {
        openCameraBtn.addEventListener('click', async () => {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                
                let videoContainer = document.getElementById('qr-video-container');
                if (!videoContainer) {
                    videoContainer = document.createElement('div');
                    videoContainer.id = 'qr-video-container';
                    videoContainer.style = 'position:relative; margin:15px 0; border-radius:12px; overflow:hidden; background:#000;';
                    videoContainer.innerHTML = `
                        <video id="qr-video" autoplay playsinline style="width:100%; height:220px; object-fit:cover;"></video>
                        <button id="close-camera" style="position:absolute; top:10px; left:10px; background:#ff3b30; color:white; border:none; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer;">✕</button>
                    `;
                    openCameraBtn.parentNode.insertBefore(videoContainer, openCameraBtn.nextSibling);
                }
                
                const video = document.getElementById('qr-video');
                video.srcObject = cameraStream;
                videoContainer.style.display = 'block';
                openCameraBtn.disabled = true;
                scanningActive = true;
                requestAnimationFrame(scanQR);

                document.getElementById('close-camera').onclick = () => {
                    scanningActive = false;
                    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                    videoContainer.style.display = 'none';
                    openCameraBtn.disabled = false;
                };

            } catch (err) {
                alert('❌ تأكد من منح صلاحية الكاميرا من إعدادات المتصفح (القفل 🔒 بجانب الرابط)');
            }
        });
    }

    function scanQR() {
        if (!scanningActive) return;
        const video = document.getElementById('qr-video');
        if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
            requestAnimationFrame(scanQR);
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);

        if (code) {
            scanningActive = false;
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            const container = document.getElementById('qr-video-container');
            if (container) container.style.display = 'none';
            if (openCameraBtn) openCameraBtn.disabled = false;
            parseQR(code.data);
            return;
        }
        requestAnimationFrame(scanQR);
    }

    function parseQR(data) {
        qrData.receiver = extractVal(data, 'اسم المستلم', 'حساب') || 'عبد حمد الشواخ';
        qrData.receiverAcc = extractVal(data, 'حساب المستلم', 'رقم') || '3701********';
        qrData.ref = extractVal(data, 'رقم العملية', 'تاريخ') || '417501845';
        qrData.date = extractVal(data, 'تاريخ العملية', 'الوقت') || '2026-08-30';
        qrData.time = extractVal(data, 'الوقت', '') || '10:10:22';

        if (receiverEl) receiverEl.textContent = 'اسم المستلم: ' + qrData.receiver;
        if (receiverAccEl) receiverAccEl.textContent = 'حساب المستلم: ' + qrData.receiverAcc;
        if (refEl) refEl.textContent = 'رقم العملية: ' + qrData.ref;
        if (dateTimeEl) dateTimeEl.textContent = 'التاريخ والوقت: ' + qrData.date + ' - ' + qrData.time;

        alert('✅ تم قراءة الكود!\nالمرسل: ' + SENDER_FIXED + '\nالمستلم: ' + qrData.receiver + '\n\n👉 أدخل المبلغ ثم اضغط إنشاء PDF');
        if (amountInput) amountInput.focus();
    }

    function extractVal(text, start, end) {
        const s = text.indexOf(start);
        if (s === -1) return '';
        const startLen = start.length;
        const e = end ? text.indexOf(end, s + startLen) : text.length;
        return text.substring(s + startLen, e === -1 ? text.length : e).replace(/[:：]/g, '').trim();
    }

    // 📄 إنشاء الإشعار — اسم المرسل باللون الأخضر
    if (pdfBtn) {
        pdfBtn.addEventListener('click', () => {
            const amount = amountInput ? amountInput.value.trim() : '0';
            
            if (!qrData.ref) {
                alert('⚠️ الرجاء مسح كود QR أولاً!');
                return;
            }

            let preview = document.getElementById('dekont-preview');
            if (!preview) {
                preview = document.createElement('div');
                preview.id = 'dekont-preview';
                preview.style = 'background:#fff; padding:25px; direction:rtl; text-align:right; max-width:380px; margin:20px auto; border:1px solid #ddd; font-family:Arial, sans-serif;';
                pdfBtn.parentNode.appendChild(preview);
            }

            const now = new Date();
            const genDate = now.toLocaleDateString('ar-SA');
            const genTime = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', hour12: true });

            preview.innerHTML = `
                <div style="text-align:center; font-size:26px; font-weight:bold; margin-bottom:20px; border-bottom:1px solid #999; padding-bottom:10px;">شام كاش</div>
                <div style="margin-bottom:6px;">العملية - إرسال <span style="float:left;">رقم ${qrData.ref}</span></div>
                <div style="margin-bottom:6px;">تاريخ العملية: <span style="float:left;">${qrData.date} - ${qrData.time}</span></div>
                <hr style="border:none; border-top:1px solid #ccc; margin:10px 0;">
                <div style="margin-bottom:6px;">اسم المرسل: <span style="color:#22c55e; font-weight:bold; float:left;">${SENDER_FIXED}</span></div>
                <div style="margin-bottom:6px;">حساب المرسل: <span style="float:left;">${SENDER_ACCOUNT}</span></div>
                <div style="margin-bottom:6px;">اسم المستلم: <span style="float:left;">${qrData.receiver}</span></div>
                <div style="margin-bottom:6px;">حساب المستلم: <span style="float:left;">${qrData.receiverAcc}</span></div>
                <hr style="border:none; border-top:1px solid #ccc; margin:10px 0;">
                <div style="margin-bottom:6px; font-size:18px; font-weight:bold;">المبلغ: <span style="float:left;">$ ${amount}</span></div>
                <div style="margin-bottom:6px;">الملاحظة: <span style="float:left;">تم إنشاء الملف عبر شام كاش</span></div>
                <hr style="border:none; border-top:1px solid #ccc; margin:15px 0;">
                <div style="text-align:center; color:#007AFF; font-size:14px;">تم إنشاء الملف عبر شام كاش</div>
                <div style="text-align:center; font-size:11px; color:#888; margin-top:5px;">${genDate} - ${genTime}</div>
                <button id="download-pdf" style="width:100%; padding:12px; margin-top:15px; background:#007AFF; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;">⬇️ تحميل PDF</button>
            `;

            document.getElementById('download-pdf').onclick = () => {
                html2pdf()
                    .set({ margin: 5, filename: 'DEKONT-' + Date.now() + '.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } })
                    .from(preview)
                    .save()
                    .then(() => alert('✅ تم حفظ الملف PDF بنجاح!'));
            };

            preview.scrollIntoView({ behavior: 'smooth' });
            alert('✅ تم إنشاء الإشعار!\nالمرسل: ' + SENDER_FIXED + '\nالمبلغ: $ ' + amount);
        });
    }
});
</script>
